<script>
(() => {
  const S = JSON.parse(document.getElementById('story').textContent);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmtMonth = m => new Date(m + '-01T12:00').toLocaleDateString('en', { month: 'long', year: 'numeric' });
  const shortMonth = m => new Date(m + '-01T12:00').toLocaleDateString('en', { month: 'short' }) + " '" + m.slice(2, 4);
  const fmtDate = d => new Date(d.slice(0, 10) + 'T12:00').toLocaleDateString('en', { day: 'numeric', month: 'short', year: 'numeric' });
  const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + 's')}`;
  const hh = h => String(h).padStart(2, '0') + ':00';
  const r = (i, cls = '') => `class="rise ${cls}" style="--i:${i}"`;

  function barPath(x, y, w, h, rad) {
    rad = Math.min(rad, w / 2, h);
    return `M${x},${y + h}V${y + rad}Q${x},${y} ${x + rad},${y}H${x + w - rad}Q${x + w},${y} ${x + w},${y + rad}V${y + h}Z`;
  }

  function barChart(values, { tips, hi, label }) {
    const W = 600, H = 170, n = values.length, max = Math.max(1, ...values);
    const step = W / n, gap = Math.min(Math.max(2, step * 0.18), 10), w = step - gap;
    const cols = values.map((v, i) => {
      const x = i * step + gap / 2, h = (v / max) * (H - 6);
      const mark = v > 0
        ? `<path class="bar${i === hi ? ' hi' : ''}" style="--d:${i * 22}ms" d="${barPath(x, H - h, w, h, 4)}"/>`
        : `<rect class="stub" x="${x}" y="${H - 2}" width="${w}" height="2" rx="1"/>`;
      return `<g class="col">${mark}<rect class="hit" x="${i * step}" y="0" width="${step}" height="${H}" data-tip="${esc(tips[i])}"/></g>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">` +
      `<line class="base" x1="0" x2="${W}" y1="${H}" y2="${H}"/>${cols}</svg>`;
  }

  function axis(n, marks) {
    return `<div class="axis">${marks.map(([i, text]) =>
      `<span style="left:${((i + 0.5) / n) * 100}%">${esc(text)}</span>`).join('')}</div>`;
  }

  function lineChart(weeks, typical) {
    const W = 600, H = 190, pad = 8, n = weeks.length;
    const max = Math.max(1, ...weeks.map(w => w.hours));
    const x = i => pad + (i * (W - 2 * pad)) / Math.max(1, n - 1);
    const y = v => H - pad - (v / max) * (H - 2 * pad - 8);
    const pts = weeks.map((w, i) => `${x(i).toFixed(1)},${y(w.hours).toFixed(1)}`);
    const line = 'M' + pts.join('L');
    const peak = weeks.reduce((b, w, i) => (w.hours > weeks[b].hours ? i : b), 0);
    return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly logtime average, ${n} weeks">` +
      `<path class="area" d="${line}L${x(n - 1)},${H - pad}L${x(0)},${H - pad}Z"/>` +
      `<line class="base" x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}"/>` +
      `<line class="typical" x1="0" x2="${W}" y1="${y(typical)}" y2="${y(typical)}"/>` +
      `<path class="line" pathLength="1" d="${line}"/>` +
      `<circle class="peak" cx="${x(peak)}" cy="${y(weeks[peak].hours)}" r="6"/>` +
      `<line class="cross" x1="0" x2="0" y1="0" y2="${H - pad}"/>` +
      `<circle class="cursor" r="6" cx="0" cy="0"/>` +
      `<rect class="overlay" width="${W}" height="${H}"/></svg>`;
  }

  function bindLineChart(root, weeks) {
    const svg = root.querySelector('.line-chart');
    if (!svg) return;
    const W = 600, H = 190, pad = 8, n = weeks.length;
    const max = Math.max(1, ...weeks.map(w => w.hours));
    const cross = svg.querySelector('.cross'), cursor = svg.querySelector('.cursor');
    svg.addEventListener('pointermove', e => {
      const box = svg.getBoundingClientRect();
      const fx = ((e.clientX - box.left) / box.width) * W;
      const i = Math.max(0, Math.min(n - 1, Math.round(((fx - pad) / (W - 2 * pad)) * (n - 1))));
      const cx = pad + (i * (W - 2 * pad)) / Math.max(1, n - 1);
      const cy = H - pad - (weeks[i].hours / max) * (H - 2 * pad - 8);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx);
      cursor.setAttribute('cx', cx); cursor.setAttribute('cy', cy);
      showTip(`Week of ${fmtDate(weeks[i].week)}: ${weeks[i].hours.toFixed(1)}h`,
        box.left + (cx / W) * box.width, box.top + (cy / H) * box.height);
    });
    svg.addEventListener('pointerleave', hideTip);
  }

  function hbars(rows, scale, fmt) {
    return `<div class="hrows">${rows.map(row => `
      <div class="hrow" data-tip="${esc(row.label)}: ${esc(fmt(row.value))}">
        <span class="hlabel">${esc(row.label)}</span>
        <div class="htrack"><div class="hbar" style="--w:${Math.max(2, (row.value / scale) * 100)}%"></div></div>
        <span class="hval">${esc(fmt(row.value))}</span>

  // ---------- slides ----------
  const THEMES = {

  const INTROS = [

  add('plum', 'Intro', `

  {

  if (T) {

    add('ink', 'Busiest month', `

      <figure ${r(3, 'chart')} data-noadvance>

    const facts = [];
    if (T.rushWeek.count >= 2) facts.push(`<div class="fact"><p class="kicker">Speedrun week</p>

  if (pr.active + pr.failed > 0) {
    const blocks = [];
    if (pr.active) blocks.push(`<div ${r(2, 'fact')}><p class="kicker">In the oven</p>
      <div class="chips" style="margin-top:8px">${pr.activeTitles.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>`);
    if (pr.failed) blocks.push(`<div ${r(3, 'fact')}><p class="kicker">Unfinished business</p>
      <div class="chips" style="margin-top:8px">${pr.failedTitles.map(t => `<span class="chip solid">✗ ${esc(t)}</span>`).join('')}</div>
      <p class="note" style="margin-top:8px">Every FAILED is just a retry with extra lore.</p></div>`);
    add('tang', 'Still cooking', `
      <p ${r(0, 'kicker')}>Still cooking</p>
      <h2 ${r(1, 'big')}>${pr.active ? plural(pr.active, 'project') + ' on the stove' : 'Some scores to settle'}</h2>
      ${blocks.join('')}`);
  }

  if (C) {
    const P2 = {
      night: ['Night owl', 'Most of your projects wrapped up after dark. The cluster lights stay on for you.'],
      morning: ['Early bird', 'You close things out before most people finish breakfast.'],
      day: ['Daylight hours', 'Respectable hours. Your sleep schedule thanks you.'],
    }[C.persona];
    if (C.persona === 'day' && (C.peakHour >= 22 || C.peakHour <= 4)) {
      P2[1] = "Mostly respectable hours, but your record hour is the middle of the night. We won't ask.";
    }
    const favDay = C.weekdays.reduce((a, b) => (b.count > a.count ? b : a));
    add('night', 'Clock', `
      <p ${r(0, 'kicker')}>When your projects crossed the finish line</p>
      <h2 ${r(1, 'big accent')}>${P2[0]}</h2>
      <p ${r(2, 'lede')}>${P2[1]} Peak hour: <b>${hh(C.peakHour)}</b>. Favourite day: <b>${favDay.day}</b>.</p>
      <figure ${r(3, 'chart')} data-noadvance>
        ${barChart(C.hours, { hi: C.peakHour, label: 'Projects completed by hour of day', tips: C.hours.map((c, h) => `${hh(h)}–${hh((h + 1) % 24)}: ${plural(c, 'project')}`) })}
        ${axis(24, [[0, '00:00'], [6, '06:00'], [12, '12:00'], [18, '18:00'], [23, '23:00']])}
      </figure>
      <p ${r(4, 'note')}>Based on when each project was marked complete, in your local time.</p>`);
  }

  if (Q) {
    const top = Q.mates[0];
    const line = top.count >= 3 ? "That's basically a marriage at this point." : 'A partnership forged in merge conflicts.';
    add('rose', 'Squad', `
      <p ${r(0, 'kicker')}>Your ride-or-die</p>
      <h2 ${r(1, 'big accent')}>${esc(top.login)}</h2>
      <p ${r(2, 'lede')}>${plural(top.count, 'project')} together. ${line}</p>
      <div ${r(3, 'people')}>${Q.mates.map(p => `<div class="person"><span class="avatar">${esc(p.login.slice(0, 2).toUpperCase())}</span>
        ${esc(p.login)}<small>${plural(p.count, 'project')}</small></div>`).join('')}</div>
      <p ${r(4, 'note')}>${plural(Q.uniqueMates, 'different teammate')} across ${plural(Q.groupProjects, 'group project')}. You were teamlead ${plural(Q.teamlead, 'time')}.</p>`);
  }

  if (K && K.total) {
    const label = { ACCEPTED: 'cleared', IN_PROGRESS: 'in progress', REGISTERED: 'registered', ASSIGNED: 'assigned', FAILED: 'failed' };
    const rows = K.list.slice(0, 7);
    add('mint', 'Courses', `
      <p ${r(0, 'kicker')}>Course clusters</p>
      <h2 ${r(1, 'big')}><span class="accent">${K.done}</span> of ${K.total} cleared</h2>
      <div ${r(2, 'courses')}>${rows.map(c => `
        <div class="course">
          <div class="course-top"><span>${esc(c.title)}</span>
            <span class="pill${c.status === 'ACCEPTED' ? ' ok' : ''}">${esc(label[c.status] || c.status)}</span></div>
          ${c.projectsSeen ? `<p>${c.projectsDone}/${c.projectsSeen} passed · ${c.projects.slice(0, 6).map(esc).join(', ')}${c.projects.length > 6 ? '…' : ''}</p>` : ''}
        </div>`).join('')}</div>
      ${K.list.length > rows.length ? `<p class="note">+${K.list.length - rows.length} more</p>` : ''}`);
  }

  if (M && M.itemsTotal) {
    const shown = M.branches.slice(0, 12);
    let d = 0;
    add('plum', 'Map', `
      <p ${r(0, 'kicker')}>The project map</p>
      <div ${r(1, 'huge accent')}><span data-count="${M.percent}">${M.percent}</span><span class="unit">%</span></div>
      <p ${r(2, 'lede')}>of the map explored${M.percent < 10 ? ". It covers every track, so there's plenty of fog left" : ''}. ${M.itemsDone} of ${M.itemsTotal} nodes lit up${M.branchesCleared.length ? `, and you fully cleared <b>${M.branchesCleared.slice(0, 4).map(esc).join(', ')}</b>${M.branchesCleared.length > 4 ? ' and more' : ''}` : ''}.</p>
      <div ${r(3, 'grid')} data-noadvance>${shown.map(b => `
        <div class="branch${b.done === b.total ? ' clear' : ''}" data-tip="${esc(b.label)}: ${b.done}/${b.total}">
          <b>${esc(b.label)}</b>
          <div class="cells">${Array.from({ length: b.total }, (_, i) => `<i class="${i < b.done ? 'on' : ''}" style="--d:${(d++) * 18}ms"></i>`).join('')}</div>
        </div>`).join('')}</div>
      ${M.branches.length > shown.length ? `<p class="note">+${M.branches.length - shown.length} more branches</p>` : ''}`);
  }

  if (L) {
    const ratio = L.peakRatio && L.peakRatio >= 1.2 ? `, ${L.peakRatio}× your usual` : '';
    add('ink', 'Logtime', `
      <p ${r(0, 'kicker')}>Time on campus</p>
      <h2 ${r(1, 'big')}>Typical week: <span class="accent">${L.typical}h</span></h2>
      <p ${r(2, 'lede')}>Your most-campus week was the week of <b>${fmtDate(L.peak.week)}</b> at ${L.peak.hours.toFixed(1)}h${ratio}.</p>
      <figure ${r(3, 'chart')} data-noadvance>${lineChart(L.weeks, L.typical)}
        ${axis(L.weeks.length, [[0, fmtDate(L.weeks[0].week)], [L.weeks.length - 1, fmtDate(L.weeks[L.weeks.length - 1].week)]])}
      </figure>
      <p ${r(4, 'note')}>On campus ${L.activeWeeks} of ${L.totalWeeks} weeks · longest break ${plural(L.longestBreak, 'week')} · dashed line is your typical week · values are the platform's weekly logtime average.</p>`,
      el => bindLineChart(el, L.weeks));
  }

  if (F) {
    add('forest', 'Feedback', `
      <p ${r(0, 'kicker')}>Your peers' verdict</p>
      <p ${r(1, 'lede')}>After your reviews, people describe you as…</p>
      <h2 ${r(2, 'big accent')}>${esc(F.title)}</h2>
      <div ${r(3)} data-noadvance>${hbars([...F.rows].sort((a, b) => b.value - a.value), F.scale, v => v.toFixed(1))}</div>`);
  }

  if (SK && SK.top.length) {
    const scale = SK.top[0].points || 1;
    add('night', 'Skills', `
      <p ${r(0, 'kicker')}>Your strongest skill</p>
      <h2 ${r(1, 'big accent')}>${esc(SK.top[0].name)}</h2>
      <div ${r(2)} data-noadvance>${hbars(SK.top.map(s => ({ label: s.name, value: s.points })), scale, v => String(v))}</div>
      <p ${r(3, 'note')}>Top ${SK.top.length} of ${plural(SK.count, 'skill')}, by skill points.</p>`);
  }

  {
    const pts = S.points || {}, co = S.coalition;
    const tiles = [];
    if (pts.coins != null) tiles.push(['Coins', pts.coins]);
    if (pts.peerReviewPoints != null) tiles.push(['Peer review pts', pts.peerReviewPoints]);
    if (pts.codeReviewPoints != null) tiles.push(['Code review pts', pts.codeReviewPoints]);
    if (co) tiles.push([co.name, co.rank != null ? '#' + co.rank : '—']);
    if (tiles.length || B) {
      const badges = B ? B.list.slice(-12).map(b => `<div class="badge" data-tip="${esc(b.name)}${b.date ? ' · ' + fmtDate(b.date) : ''}">${b.icon
        ? `<img src="${esc(b.icon)}" alt="${esc(b.name)}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${esc(b.name.slice(0, 1).toUpperCase())}'))">`
        : esc(b.name.slice(0, 1).toUpperCase())}</div>`).join('') : '';
      add('lemon', 'Loot', `
        <p ${r(0, 'kicker')}>The loot</p>
        <h2 ${r(1, 'big')}>${B ? `<span class="accent">${plural(B.count, 'badge')}</span>` : 'Your stash'}</h2>
        ${B ? `<div ${r(2, 'badges')} data-noadvance>${badges}</div>` : ''}
        <div ${r(3, 'tiles')}>${tiles.map(([k, v]) => `<div class="tile"><p class="kicker">${esc(k)}</p><p class="mid">${esc(v)}</p></div>`).join('')}</div>
        ${co ? `<p ${r(4, 'note')}>Coalition rank shown next to ${esc(co.name)}.</p>` : ''}`);
    }
  }

  {
    const cells = [['Projects passed', pr.done]];
    if (G) cells.push(['Average grade', G.average + '%']);
    if (T) cells.push(['Busiest month', shortMonth(T.peakMonth.month)]);
    if (Q) cells.push(['Ride-or-die', Q.mates[0].login]);
    if (SK && SK.top.length) cells.push(['Top skill', SK.top[0].name]);
    if (M) cells.push(['Map explored', M.percent + '%']);
    else if (F) cells.push(['Peers say', F.title]);
    if (C && cells.length < 6) cells.push(['Peak hour', hh(C.peakHour)]);
    if (L && cells.length < 6) cells.push(['Typical week', L.typical + 'h']);
    add('plum', 'Summary', `
      <div ${r(0, 'card')}>
        <p class="kicker">School 21 Wrapped · ${esc(S.login)}</p>
        <div><p class="kicker" style="margin-bottom:6px">You are a</p><h2 class="big">${esc(S.persona)}</h2></div>
        <div class="card-grid">${cells.slice(0, 6).map(([k, v]) => `<div><span>${esc(k)}</span><b title="${esc(v)}">${esc(v)}</b></div>`).join('')}</div>
        <div class="card-foot"><span>${esc([P.campus && P.campus.shortName, P.className].filter(Boolean).join(' · '))}</span><span>${S.fetchedAt ? fmtDate(S.fetchedAt) : ''}</span></div>
      </div>
      <p ${r(1, 'hint')}>Screenshot this and flex on your cluster.</p>`);
  }

  // ---------- stage ----------
  const stage = document.getElementById('stage');
  const host = document.getElementById('slides');
  const bars = document.getElementById('bars');
  const tip = document.getElementById('tip');
  const els = slides.map((s, i) => {
    const el = document.createElement('section');
    const [bg, fg, accent] = THEMES[s.theme];
    el.className = 'slide';
    el.style.cssText = `--bg:${bg};--fg:${fg};--accent:${accent}`;
    el.setAttribute('role', 'group');
    el.setAttribute('aria-roledescription', 'slide');
    el.setAttribute('aria-label', `${i + 1} of ${slides.length}: ${s.label}`);
    el.innerHTML = `<div class="inner">${s.html}</div>`;
    host.appendChild(el);
    if (s.mount) s.mount(el);
    const b = document.createElement('button');
    b.setAttribute('aria-label', `Go to slide ${i + 1}: ${s.label}`);
    b.addEventListener('click', e => { e.stopPropagation(); show(i); });
    bars.appendChild(b);
    return el;
  });

  function countUp(el) {
    el.querySelectorAll('[data-count]').forEach(node => {
      const target = Number(node.dataset.count);
      if (reduced || !target) { node.textContent = target; return; }
      const start = performance.now(), dur = 1100;
      const tick = now => {
        const t = Math.min(1, (now - start) / dur);
        node.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
        if (t < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  let cur = -1;
  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === cur) return;
    cur = i;
    hideTip();
    els.forEach((el, j) => el.classList.toggle('on', j === i));
    [...bars.children].forEach((b, j) => { b.className = j < i ? 'past' : j === i ? 'now' : ''; });
    stage.style.cssText = els[i].style.cssText;
    document.body.style.cssText = els[i].style.cssText;
    els[i].scrollTop = 0;
    countUp(els[i]);
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { /* file:// in some browsers */ }
  }

  stage.addEventListener('click', e => {
    if (e.target.closest('[data-noadvance], button, a')) return;
    show(e.clientX < innerWidth * 0.3 ? cur - 1 : cur + 1);
  });
  document.getElementById('prev').addEventListener('click', e => { e.stopPropagation(); show(cur - 1); });
  document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); show(cur + 1); });
  addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length - 1);
  });

  function showTip(text, x, y) {
    tip.textContent = text;
    const half = tip.offsetWidth / 2 + 8;
    tip.style.left = Math.max(half, Math.min(innerWidth - half, x)) + 'px';
    tip.style.top = Math.max(48, y) + 'px';
    tip.classList.add('show');
  }
  function hideTip() { tip.classList.remove('show'); }
  document.addEventListener('pointermove', e => {
    if (e.target.closest('.line-chart')) return;
    const t = e.target.closest('[data-tip]');
    if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-tip]');
    if (t) showTip(t.dataset.tip, e.clientX, e.clientY);
  });

  show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
})();
</script>
</body>
</html>
